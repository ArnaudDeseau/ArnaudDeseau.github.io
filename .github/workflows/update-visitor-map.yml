name: Update visitor map

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch visitors by country from GoatCounter
        run: python3 scripts/update_visitor_map.py
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: arnaudd
          START_DATE: "2020-01-01"   # change to when you started using GoatCounter

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitors.json
          git diff --cached --quiet || (git commit -m "Update visitor map data" && git push)
