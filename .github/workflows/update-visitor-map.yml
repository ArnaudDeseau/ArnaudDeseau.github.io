name: Update visitor map

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install country code list
        run: pip install pycountry

      - name: Fetch visitors by country from GoatCounter
        run: python3 scripts/update_visitor_map.py
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: arnaudd
          START_DATE: "2026-10-13"   # first day of GoatCounter statistics

      - name: Commit updated data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/visitors.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update visitor map data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made by this workflow don't make GitHub Pages rebuild the site
      # by themselves, so ask for a rebuild explicitly.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
