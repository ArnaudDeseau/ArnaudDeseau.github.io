<!-- Visitor map (data refreshed automatically from GoatCounter, see _data/visitors.json) -->
<h2 style="margin-top: 2em;">Visitors around the world</h2>
<div id="visitor-map" style="width: 100%; aspect-ratio: 16 / 9;"></div>
<p id="visitor-map-caption" style="font-size: 0.75em; color: #777;"></p>

<script src="https://www.gstatic.com/charts/loader.js"></script>
<script>
  function playSound() {
    document.getElementById('clickSound').play();
  }

  (function () {
    var visitors = {{ site.data.visitors | jsonify }};
    if (!visitors || !visitors.countries || !visitors.countries.length) {
      document.getElementById('visitor-map').style.display = 'none';
      return;
    }

    google.charts.load('current', { packages: ['geochart'] });
    google.charts.setOnLoadCallback(drawMap);
    window.addEventListener('resize', function () {
      clearTimeout(window._mapResize);
      window._mapResize = setTimeout(drawMap, 200);
    });

    function drawMap() {
      var data = new google.visualization.DataTable();
      data.addColumn('string', 'Country');
      data.addColumn('number', 'Visitors');
      visitors.countries.forEach(function (c) {
        // Colour on a log scale so one big country doesn't wash out the rest,
        // but show the real number in the tooltip.
        data.addRow([
          { v: c.code, f: c.name },
          { v: Math.log10(c.count + 1), f: c.count.toLocaleString() }
        ]);
      });

      var chart = new google.visualization.GeoChart(document.getElementById('visitor-map'));
      chart.draw(data, {
        colorAxis: { colors: ['#d6e6f5', '#08306b'] },
        datalessRegionColor: '#eeeeee',
        backgroundColor: 'transparent',
        legend: 'none',
        keepAspectRatio: true
      });
    }

    document.getElementById('visitor-map-caption').textContent =
      visitors.total.toLocaleString() + ' visitors from ' +
      visitors.countries.length + ' countries since ' + visitors.since +
      ' · last updated ' + visitors.updated;
  })();
</script>
