<!-- Visitor map. Data is refreshed daily from GoatCounter into _data/visitors.json.
     NB: this theme squeezes each page onto one line, so the scripts below must
     only use /* */ comments, never // comments. -->
<style>
  .vmap { position: relative; margin-top: 0.5em; border-radius: 6px; overflow: hidden; background: #f4f8fb; }
  .vmap svg { display: block; width: 100%; height: auto; cursor: grab; }
  .vmap svg:active { cursor: grabbing; }
  .vmap-sphere { fill: #f4f8fb; stroke: #c9d6e2; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .vmap-graticule { fill: none; stroke: #e1e9f0; stroke-width: 0.5; vector-effect: non-scaling-stroke; }
  .vmap-country { stroke: #ffffff; stroke-width: 0.5; vector-effect: non-scaling-stroke; }
  .vmap-country:hover, .vmap-marker:hover { stroke: #222222; stroke-width: 1.5; }
  .vmap-marker { stroke: #ffffff; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .vmap-controls { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .vmap-controls button { width: 28px; height: 28px; padding: 0; border: 1px solid #c9d6e2; border-radius: 4px; background: #ffffff; color: #333333; font-size: 16px; line-height: 26px; cursor: pointer; }
  .vmap-controls button:hover { background: #eef3f8; }
  .vmap-tip { position: absolute; z-index: 3; pointer-events: none; padding: 4px 8px; border-radius: 4px; background: rgba(20, 30, 45, 0.9); color: #ffffff; font-size: 0.75em; white-space: nowrap; transform: translate(-50%, -130%); }
  .vmap-tip[hidden] { display: none; }
  .vmap-caption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0.5em 0 0.3em; font-size: 0.75em; color: #666666; }
  .vmap-legend { display: inline-flex; align-items: center; gap: 6px; }
  .vmap-legend-bar { display: inline-block; width: 90px; height: 8px; border-radius: 4px; }
  .vmap-list { font-size: 0.8em; }
  .vmap-list summary { cursor: pointer; color: #555555; }
  .vmap-list ol { columns: 3 11em; column-gap: 2em; margin: 0.5em 0 0; padding-left: 1.6em; }
  .vmap-list li { break-inside: avoid; }
  .vmap-list button { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .vmap-list button:hover { text-decoration: underline; }
  .vmap-list .vmap-count { color: #888888; }
</style>

<h2 style="margin-top: 2em;">Visitors around the world</h2>
<div id="visitor-map-wrap" class="vmap">
  <div class="vmap-controls">
    <button type="button" data-zoom="in" title="Zoom in" aria-label="Zoom in">+</button>
    <button type="button" data-zoom="out" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <button type="button" data-zoom="reset" title="Show the whole world" aria-label="Show the whole world">&#8634;</button>
  </div>
  <svg id="visitor-map" role="img" aria-label="World map of visitors by country"></svg>
  <div id="visitor-map-tip" class="vmap-tip" hidden></div>
</div>
<div id="visitor-map-caption" class="vmap-caption"></div>
<details id="visitor-map-list" class="vmap-list">
  <summary></summary>
  <ol></ol>
</details>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
  function playSound() {
    document.getElementById('clickSound').play();
  }

  (function () {
    var visitors = {{ site.data.visitors | jsonify }};
    var wrap = document.getElementById('visitor-map-wrap');
    var parts = [wrap, document.getElementById('visitor-map-caption'), document.getElementById('visitor-map-list')];
    function hideMap() {
      parts.forEach(function (el) { el.style.display = 'none'; });
    }
    if (!visitors || !visitors.countries || !visitors.countries.length || !window.d3 || !window.topojson) {
      hideMap();
      return;
    }

    d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
      .then(draw)
      .catch(hideMap);

    function draw(world) {
      var W = 960;
      var sphere = { type: 'Sphere' };
      /* Equal Earth: an equal-area projection, so countries keep their true relative size. */
      var projection = d3.geoEqualEarth().fitWidth(W, sphere);
      var path = d3.geoPath(projection);
      var H = Math.ceil(path.bounds(sphere)[1][1]);
      var MAX_ZOOM = 24;
      var MARKER_R = 4.5;

      var byNum = {};
      var byName = {};
      visitors.countries.forEach(function (c) {
        if (c.num) { byNum[c.num] = c; }
        byName[c.name.toLowerCase()] = c;
      });

      var features = topojson.feature(world, world.objects.countries).features;
      features.forEach(function (f) {
        f.visitors = (f.id && byNum[f.id]) || byName[(f.properties.name || '').toLowerCase()] || null;
        f.main = mainPart(f);
        f.size = path.area(f.main);
        /* Some territories share their country's code (e.g. Ashmore Is. and Australia):
           link each country to its largest shape. */
        if (f.visitors && (!f.visitors.feature || f.size > f.visitors.feature.size)) {
          f.visitors.feature = f;
        }
      });

      var maxCount = d3.max(visitors.countries, function (c) { return c.count; });
      var shade = d3.scaleLog().domain([1, Math.max(2, maxCount)]).range([0.3, 1]).clamp(true);
      function color(n) { return d3.interpolateBlues(shade(n)); }

      var svg = d3.select('#visitor-map').attr('viewBox', [0, 0, W, H]);
      var g = svg.append('g');
      g.append('path').datum(sphere).attr('class', 'vmap-sphere').attr('d', path);
      g.append('path').datum(d3.geoGraticule10()).attr('class', 'vmap-graticule').attr('d', path);

      g.append('g').selectAll('path')
        .data(features)
        .join('path')
        .attr('class', 'vmap-country')
        .attr('d', path)
        .attr('fill', function (f) { return f.visitors ? color(f.visitors.count) : '#dde3e8'; })
        .on('mousemove', showTip)
        .on('click', showTip)
        .on('mouseleave', hideTip);

      /* Countries too small to see at world scale get a dot, so they are never lost. */
      var small = visitors.countries
        .filter(function (c) { return c.feature && c.feature.size < 30; })
        .map(function (c) { return c.feature; });
      var markers = g.append('g').selectAll('circle')
        .data(small)
        .join('circle')
        .attr('class', 'vmap-marker')
        .attr('cx', function (f) { return path.centroid(f.main)[0]; })
        .attr('cy', function (f) { return path.centroid(f.main)[1]; })
        .attr('r', MARKER_R)
        .attr('fill', function (f) { return color(f.visitors.count); })
        .on('mousemove', showTip)
        .on('click', showTip)
        .on('mouseleave', hideTip);

      /* Zoom: buttons, double-click, drag to move, pinch, or Ctrl/Cmd + scroll
         (plain scrolling keeps scrolling the page). */
      var zoom = d3.zoom()
        .scaleExtent([1, MAX_ZOOM])
        .translateExtent([[0, 0], [W, H]])
        .filter(function (event) {
          if (event.type === 'wheel') { return event.ctrlKey || event.metaKey; }
          return !event.button;
        })
        .on('zoom', function (event) {
          g.attr('transform', event.transform);
          var k = event.transform.k;
          /* Keep dots the same size on screen, and drop them once the country is big enough to see. */
          markers
            .attr('r', MARKER_R / k)
            .style('display', function (f) { return f.size * k * k > 150 ? 'none' : null; });
          hideTip();
        });
      svg.call(zoom);

      d3.selectAll('.vmap-controls button').on('click', function () {
        var action = this.getAttribute('data-zoom');
        var t = svg.transition().duration(350);
        if (action === 'in') { zoom.scaleBy(t, 2); }
        if (action === 'out') { zoom.scaleBy(t, 0.5); }
        if (action === 'reset') { zoom.transform(t, d3.zoomIdentity); }
      });

      function zoomTo(f) {
        var b = path.bounds(f.main);
        var dx = Math.max(b[1][0] - b[0][0], 1);
        var dy = Math.max(b[1][1] - b[0][1], 1);
        var k = Math.min(MAX_ZOOM, 0.5 / Math.max(dx / W, dy / H));
        var cx = (b[0][0] + b[1][0]) / 2;
        var cy = (b[0][1] + b[1][1]) / 2;
        svg.transition().duration(750).call(
          zoom.transform,
          d3.zoomIdentity.translate(W / 2 - k * cx, H / 2 - k * cy).scale(k)
        );
        wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      var tip = document.getElementById('visitor-map-tip');
      function showTip(event, f) {
        var name = f.visitors ? f.visitors.name : f.properties.name;
        var n = f.visitors ? f.visitors.count : 0;
        tip.textContent = name + ': ' + (n ? n.toLocaleString() + (n === 1 ? ' visitor' : ' visitors') : 'no visitors yet');
        var p = d3.pointer(event, wrap);
        tip.style.left = p[0] + 'px';
        tip.style.top = p[1] + 'px';
        tip.hidden = false;
      }
      function hideTip() { tip.hidden = true; }

      /* Caption with colour legend. */
      var caption = d3.select('#visitor-map-caption');
      var legend = caption.append('span').attr('class', 'vmap-legend');
      legend.append('span').text('1');
      legend.append('span').attr('class', 'vmap-legend-bar')
        .style('background', 'linear-gradient(to right, ' + d3.range(0, 1.01, 0.25).map(function (s) {
          return d3.interpolateBlues(0.3 + 0.7 * s);
        }).join(', ') + ')');
      legend.append('span').text(maxCount.toLocaleString() + ' visitors');
      caption.append('span').text(
        visitors.total.toLocaleString() + ' visitors from ' + visitors.countries.length +
        ' countries since ' + formatDate(visitors.since) + ' (updated ' + formatDate(visitors.updated) + ')'
      );
      caption.append('span').text('Drag to move; zoom with the buttons, a double-click, a pinch, or Ctrl + scroll.');

      /* Full list of countries; clicking one zooms the map to it. */
      d3.select('#visitor-map-list summary').text('All ' + visitors.countries.length + ' countries');
      var items = d3.select('#visitor-map-list ol').selectAll('li')
        .data(visitors.countries)
        .join('li');
      items.each(function (c) {
        var li = d3.select(this);
        var label = c.feature ? li.append('button').attr('type', 'button').on('click', function () { zoomTo(c.feature); }) : li.append('span');
        label.text(c.name);
        li.append('span').attr('class', 'vmap-count').text(' ' + c.count.toLocaleString());
      });
    }

    /* For countries with overseas parts (France, Norway, the US...), use the largest
       piece for zooming and for placing dots. */
    function mainPart(f) {
      if (!f.geometry || f.geometry.type !== 'MultiPolygon') { return f; }
      var best = null;
      var bestArea = -1;
      f.geometry.coordinates.forEach(function (polygon) {
        var area = Math.abs(d3.polygonArea(polygon[0]));
        if (area > bestArea) { bestArea = area; best = { type: 'Polygon', coordinates: polygon }; }
      });
      return best;
    }

    function formatDate(iso) {
      var d = new Date(iso + 'T00:00:00Z');
      if (isNaN(d)) { return iso; }
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    }
  })();
</script>
